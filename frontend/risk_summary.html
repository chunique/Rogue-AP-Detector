<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>RogueShield — Risk Summary</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/style.css"/>
<style>
.filter-row{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.filter-chip{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:white;color:var(--slate-600);font-size:12.5px;font-weight:500;cursor:pointer;transition:all .15s}
.filter-chip:hover{border-color:var(--slate-300);background:var(--slate-50)}
.filter-chip.on{background:var(--blue-600);color:white;border-color:var(--blue-600)}
.expand-trigger{cursor:pointer;color:var(--slate-400);font-size:11px;transition:transform .2s;display:inline-block}
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-content">
    <div class="page-header">
      <div class="page-title-wrap"><div class="page-eyebrow">Analysis</div><div class="page-title">Access Point Risk Summary</div><div id="scanMeta" style="font-size:11px;color:var(--slate-400);margin-top:1px"></div></div>
      <div class="page-actions">
        <a class="btn btn-secondary btn-sm" href="results.html">← Results</a>
        <a class="btn btn-primary btn-sm" href="reports.html">Download Report →</a>
      </div>
    </div>
    <div class="page-body">
      <div id="noScan" style="display:none" class="empty-state"><span class="empty-icon">🎯</span><div class="empty-title">No scan selected</div><a class="btn btn-primary" href="scan.html">New Scan</a></div>
      <div id="content">
        <div id="alertBanners"></div>
        <div class="stats-grid" style="grid-template-columns:repeat(3,1fr)">
          <div class="stat-card red"><div class="stat-label">🚨 Rogue APs</div><div class="stat-value" id="cRogue">—</div></div>
          <div class="stat-card orange" style="animation-delay:.05s"><div class="stat-label">⚠️ Suspicious</div><div class="stat-value" id="cSusp">—</div></div>
          <div class="stat-card green" style="animation-delay:.1s"><div class="stat-label">✅ Low Risk</div><div class="stat-value" id="cLow">—</div></div>
        </div>
        <div class="card">
          <div class="card-header">
            <div><div class="card-title">All Access Points</div><div class="card-subtitle" id="tCount"></div></div>
            <input class="form-input" id="search" placeholder="Search BSSID or SSID…" style="width:200px" oninput="renderTable()"/>
          </div>
          <div class="filter-row">
            <span style="font-size:12px;color:var(--slate-400);font-weight:500">Filter:</span>
            <button class="filter-chip on" onclick="setF('all',this)">All</button>
            <button class="filter-chip" onclick="setF('ROGUE',this)">🚨 Rogue</button>
            <button class="filter-chip" onclick="setF('SUSPICIOUS',this)">⚠️ Suspicious</button>
            <button class="filter-chip" onclick="setF('LOW RISK',this)">✅ Low Risk</button>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th style="width:28px"></th><th>BSSID</th><th>SSID(s)</th><th>Risk Score</th><th>Findings</th><th>Verdict</th></tr></thead>
              <tbody id="tbody"></tbody>
            </table>
          </div>
          <div style="font-size:11.5px;color:var(--slate-400);margin-top:10px;padding:0 2px">💡 Click any row to expand per-AP findings</div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="js/common.js"></script>
<script>
let allBSSIDs=[],maxScore=1,activeFilter='all';
(async()=>{
  await initPage('risk_summary');
  const id=getCurrentScan();
  if(!id){document.getElementById('noScan').style.display='block';document.getElementById('content').style.display='none';return;}
  showLoading(true,'Loading risk data…');
  try{const res=await apiFetch(`/api/history/${id}`);if(!res)return;const d=await res.json();if(d.error)throw new Error(d.error);load(d);}
  catch(e){showToast('Error: '+e.message,'error');}finally{showLoading(false);}
})();
function load(data){
  const {bssid_scores,source_files,timestamp}=data;
  const sf=Array.isArray(source_files)?source_files.join(', '):source_files;
  document.getElementById('scanMeta').textContent=`${new Date(timestamp).toLocaleString()} · ${sf}`;
  allBSSIDs=Object.values(bssid_scores).sort((a,b)=>b.score-a.score);
  maxScore=Math.max(...allBSSIDs.map(b=>b.score),1);
  document.getElementById('cRogue').textContent=allBSSIDs.filter(b=>b.verdict==='ROGUE').length;
  document.getElementById('cSusp').textContent=allBSSIDs.filter(b=>b.verdict==='SUSPICIOUS').length;
  document.getElementById('cLow').textContent=allBSSIDs.filter(b=>b.verdict==='LOW RISK').length;
  const rogues=allBSSIDs.filter(b=>b.verdict==='ROGUE');
  const susps=allBSSIDs.filter(b=>b.verdict==='SUSPICIOUS');
  let banners='';
  if(rogues.length) banners+=`<div class="alert danger"><span class="alert-icon">🚨</span><div><strong>${rogues.length} ROGUE access point(s) detected.</strong> Immediate investigation required. BSSIDs: ${rogues.map(b=>b.bssid).join(', ')}</div></div>`;
  if(susps.length) banners+=`<div class="alert warning"><span class="alert-icon">⚠️</span><div><strong>${susps.length} suspicious access point(s)</strong> require review. Cross-reference with the authorised whitelist.</div></div>`;
  document.getElementById('alertBanners').innerHTML=banners;
  renderTable();
}
function setF(f,btn){activeFilter=f;document.querySelectorAll('.filter-chip').forEach(b=>b.classList.remove('on'));btn.classList.add('on');renderTable();}
function renderTable(){
  const q=(document.getElementById('search')?.value||'').toLowerCase();
  let rows=allBSSIDs;
  if(activeFilter!=='all') rows=rows.filter(b=>b.verdict===activeFilter);
  if(q) rows=rows.filter(b=>b.bssid.includes(q)||(b.ssids||[]).some(s=>s.toLowerCase().includes(q)));
  document.getElementById('tCount').textContent=`${rows.length} of ${allBSSIDs.length} access points`;
  const tbody=document.getElementById('tbody');
  if(!rows.length){tbody.innerHTML=`<tr><td colspan="6" class="empty-state" style="text-align:center;padding:40px;color:var(--slate-400)">No access points match this filter</td></tr>`;return;}
  tbody.innerHTML=rows.map((b,i)=>{
    const vk=b.verdict==='LOW RISK'?'LOWRISK':b.verdict.split(' ')[0];
    const rid=`r${b.bssid.replace(/:/g,'')}`;
    const eid=`e${b.bssid.replace(/:/g,'')}`;
    const seen=new Set();
    const uF=(b.findings||[]).filter(f=>{const k=f.rule+(f.ssid||'');if(seen.has(k))return false;seen.add(k);return true;});
    const fHtml=uF.map(f=>`<div class="mini-finding">${sevBadge(f.severity)}<div><div style="font-size:12.5px;font-weight:600">${f.rule}</div><div style="font-size:11.5px;color:var(--slate-500);margin-top:2px">${f.detail}</div></div></div>`).join('');
    return `<tr id="${rid}" style="cursor:pointer;animation-delay:${i*.03}s" onclick="toggle('${eid}','${rid}')">
      <td><span class="expand-trigger" id="t${rid}">▶</span></td>
      <td class="mono">${b.bssid}</td>
      <td style="font-size:12px;color:var(--slate-500)">${(b.ssids||[]).join(', ')||'—'}</td>
      <td>${scoreBar(b.score,maxScore)}</td>
      <td style="font-family:var(--font-mono);font-size:12px">${b.finding_count}</td>
      <td>${verdictBadge(b.verdict)}</td>
    </tr>
    <tr class="expand-row" id="${eid}">
      <td colspan="6" class="expand-cell">
        <div class="expand-label">Findings for ${b.bssid}</div>
        <div>${fHtml||'<div style="font-size:12px;color:var(--slate-400)">No findings</div>'}</div>
      </td>
    </tr>`;
  }).join('');
}
function toggle(eid,rid){
  const e=document.getElementById(eid),r=document.getElementById(rid);
  const open=e.classList.toggle('open');
  document.getElementById('t'+rid).textContent=open?'▼':'▶';
  if(open){r.style.background='var(--blue-50)';r.style.borderColor='var(--blue-100)';}
  else{r.style.background='';r.style.borderColor='';}
}
</script>
</body></html>
