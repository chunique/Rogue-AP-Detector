<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>RogueShield — Reset Password</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',Arial,sans-serif;background:linear-gradient(135deg,#0a1628 0%,#04080f 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.container{max-width:420px;width:100%;background:#ffffff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,0.3);overflow:hidden}
.header{background:linear-gradient(135deg,#0066ff,#00c8ff);padding:30px;text-align:center}
.header h1{color:#ffffff;font-size:24px;margin-bottom:4px}
.header p{color:rgba(255,255,255,0.8);font-size:13px}
.content{padding:40px 35px}
.form-group{margin-bottom:20px}
.form-group label{display:block;font-size:13px;font-weight:600;color:#333;margin-bottom:8px}
.form-group input{width:100%;padding:12px 16px;border:2px solid #e5e7eb;border-radius:10px;font-size:14px;transition:border-color 0.2s}
.form-group input:focus{outline:none;border-color:#0066ff}
.form-group small{font-size:11px;color:#6b7280;margin-top:6px;display:block}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,#0066ff,#00c8ff);color:#ffffff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:transform 0.2s,box-shadow 0.2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,102,255,0.3)}
.btn:disabled{opacity:0.6;cursor:not-allowed;transform:none}
.error{background:#fef2f2;border:1px solid #fca5a5;color:#dc2626;padding:12px;border-radius:8px;font-size:13px;margin-bottom:20px;display:none}
.success{background:#f0fdf4;border:1px solid #86efac;color:#16a34a;padding:12px;border-radius:8px;font-size:13px;margin-bottom:20px;display:none}
.link{text-align:center;margin-top:25px;font-size:13px;color:#6b7280}
.link a{color:#0066ff;text-decoration:none;font-weight:600}
.link a:hover{text-decoration:underline}
.back-link{display:block;text-align:center;margin-top:20px;font-size:13px;color:#6b7280;text-decoration:none}
.back-link:hover{color:#0066ff}
.icon{font-size:48px;margin-bottom:15px}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="icon">🔑</div>
    <h1>Reset Password</h1>
    <p>Enter your new password below</p>
  </div>
  <div class="content">
    <div class="error" id="errorMsg"></div>
    <div class="success" id="successMsg"></div>
    
    <div id="resetForm">
      <div class="form-group">
        <label>New Password</label>
        <input type="password" id="newPassword" placeholder="Enter new password" minlength="8"/>
        <small>Min 8 characters, must contain uppercase, lowercase, and number</small>
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Confirm new password"/>
      </div>
      <button class="btn" id="submitBtn" onclick="resetPassword()">Reset Password</button>
    </div>
    
    <div class="link">
      Remember your password? <a href="login.html">Sign in</a>
    </div>
  </div>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const token = urlParams.get('token');

if (!token) {
  document.getElementById('errorMsg').textContent = 'Invalid reset link. Please request a new password reset.';
  document.getElementById('errorMsg').style.display = 'block';
  document.getElementById('resetForm').style.display = 'none';
}

async function resetPassword() {
  const newPass = document.getElementById('newPassword').value;
  const confirmPass = document.getElementById('confirmPassword').value;
  const errorEl = document.getElementById('errorMsg');
  const successEl = document.getElementById('successMsg');
  const btn = document.getElementById('submitBtn');
  
  errorEl.style.display = 'none';
  successEl.style.display = 'none';
  
  if (newPass.length < 8) {
    errorEl.textContent = 'Password must be at least 8 characters';
    errorEl.style.display = 'block';
    return;
  }
  if (!/[A-Z]/.test(newPass)) {
    errorEl.textContent = 'Password must contain at least one uppercase letter';
    errorEl.style.display = 'block';
    return;
  }
  if (!/[a-z]/.test(newPass)) {
    errorEl.textContent = 'Password must contain at least one lowercase letter';
    errorEl.style.display = 'block';
    return;
  }
  if (!/[0-9]/.test(newPass)) {
    errorEl.textContent = 'Password must contain at least one number';
    errorEl.style.display = 'block';
    return;
  }
  if (newPass !== confirmPass) {
    errorEl.textContent = 'Passwords do not match';
    errorEl.style.display = 'block';
    return;
  }
  
  btn.disabled = true;
  btn.textContent = 'Resetting...';
  
  try {
    const res = await fetch('/api/reset-password', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({token, new_password: newPass, confirm: confirmPass})
    });
    const data = await res.json();
    
    if (data.ok) {
      successEl.textContent = data.message || 'Password reset successful! Redirecting to login...';
      successEl.style.display = 'block';
      document.getElementById('resetForm').style.display = 'none';
      setTimeout(() => window.location.href = 'login.html', 2000);
    } else {
      errorEl.textContent = data.error || 'Failed to reset password';
      errorEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Reset Password';
    }
  } catch (e) {
    errorEl.textContent = 'Network error. Please try again.';
    errorEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Reset Password';
  }
}
</script>
</body>
</html>
