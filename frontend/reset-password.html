<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>RogueShield — Reset Password</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#1E1E1E;--surface:#2D2D2D;--surface2:#3D3D3D;--surface3:#4A4A4A;
  --border:#404040;--accent:#4EC9B0;--accent-light:#6EE7D0;
  --safe:#4EC9B0;--suspicious:#CE9178;--rogue:#F44747;
  --text:#E0E0E0;--text2:#A0A0A0;--muted:#6B6B6B;
  --radius:10px;--shadow:0 2px 8px rgba(0,0,0,0.3);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',Arial,sans-serif;background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:var(--text)}
.container{max-width:420px;width:100%;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.header{background:linear-gradient(135deg,#4EC9B0,#2E8B7A);padding:32px;text-align:center}
.header h1{color:#ffffff;font-size:22px;margin-bottom:6px;font-weight:700}
.header p{color:rgba(255,255,255,0.85);font-size:13px}
.content{padding:32px}
.form-group{margin-bottom:20px}
.form-group label{display:block;font-size:13px;font-weight:500;color:var(--text2);margin-bottom:8px}
.form-group input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:var(--surface2);color:var(--text);transition:border-color 0.2s}
.form-group input:focus{outline:none;border-color:var(--accent)}
.form-group input::placeholder{color:var(--muted)}
.form-group small{font-size:11px;color:var(--muted);margin-top:6px;display:block}
.btn{width:100%;padding:12px;background:linear-gradient(135deg,var(--accent),#2E8B7A);color:var(--bg);border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:all 0.2s;box-shadow:0 2px 8px rgba(78,201,176,.25)}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(78,201,176,.35)}
.btn:disabled{opacity:0.6;cursor:not-allowed;transform:none}
.error{background:rgba(244,71,71,.1);border:1px solid rgba(244,71,71,.3);color:var(--rogue);padding:12px;border-radius:8px;font-size:13px;margin-bottom:20px;display:none}
.success{background:rgba(78,201,176,.1);border:1px solid rgba(78,201,176,.3);color:var(--accent);padding:12px;border-radius:8px;font-size:13px;margin-bottom:20px;display:none}
.link{text-align:center;margin-top:24px;font-size:13px;color:var(--muted)}
.link a{color:var(--accent);text-decoration:none;font-weight:500}
.link a:hover{text-decoration:underline}
.back-link{display:block;text-align:center;margin-top:20px;font-size:13px;color:var(--muted);text-decoration:none}
.back-link:hover{color:var(--accent)}
.icon{font-size:44px;margin-bottom:12px}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="icon">🔑</div>
    <h1>Reset Password</h1>
    <p>Enter your new password below</p>
  </div>
  <div class="content">
    <div class="error" id="errorMsg"></div>
    <div class="success" id="successMsg"></div>
    
    <div id="resetForm">
      <div class="form-group">
        <label>New Password</label>
        <input type="password" id="newPassword" placeholder="Enter new password" minlength="8"/>
        <small>Min 8 characters, must contain uppercase, lowercase, and number</small>
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Confirm new password"/>
      </div>
      <button class="btn" id="submitBtn" onclick="resetPassword()">Reset Password</button>
    </div>
    
    <div class="link">
      Remember your password? <a href="login.html">Sign in</a>
    </div>
  </div>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const token = urlParams.get('token');

if (!token) {
  document.getElementById('errorMsg').textContent = 'Invalid reset link. Please request a new password reset.';
  document.getElementById('errorMsg').style.display = 'block';
  document.getElementById('resetForm').style.display = 'none';
}

async function resetPassword() {
  const newPass = document.getElementById('newPassword').value;
  const confirmPass = document.getElementById('confirmPassword').value;
  const errorEl = document.getElementById('errorMsg');
  const successEl = document.getElementById('successMsg');
  const btn = document.getElementById('submitBtn');
  
  errorEl.style.display = 'none';
  successEl.style.display = 'none';
  
  if (newPass.length < 8) {
    errorEl.textContent = 'Password must be at least 8 characters';
    errorEl.style.display = 'block';
    return;
  }
  if (!/[A-Z]/.test(newPass)) {
    errorEl.textContent = 'Password must contain at least one uppercase letter';
    errorEl.style.display = 'block';
    return;
  }
  if (!/[a-z]/.test(newPass)) {
    errorEl.textContent = 'Password must contain at least one lowercase letter';
    errorEl.style.display = 'block';
    return;
  }
  if (!/[0-9]/.test(newPass)) {
    errorEl.textContent = 'Password must contain at least one number';
    errorEl.style.display = 'block';
    return;
  }
  if (newPass !== confirmPass) {
    errorEl.textContent = 'Passwords do not match';
    errorEl.style.display = 'block';
    return;
  }
  
  btn.disabled = true;
  btn.textContent = 'Resetting...';
  
  try {
    const res = await fetch('/api/reset-password', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({token, new_password: newPass, confirm: confirmPass})
    });
    const data = await res.json();
    
    if (data.ok) {
      successEl.textContent = data.message || 'Password reset successful! Redirecting to login...';
      successEl.style.display = 'block';
      document.getElementById('resetForm').style.display = 'none';
      setTimeout(() => window.location.href = 'login.html', 2000);
    } else {
      errorEl.textContent = data.error || 'Failed to reset password';
      errorEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Reset Password';
    }
  } catch (e) {
    errorEl.textContent = 'Network error. Please try again.';
    errorEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Reset Password';
  }
}
</script>
</body>
</html>
