<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>RogueShield — History</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#1E1E1E;--surface:#2D2D2D;--surface2:#3D3D3D;--surface3:#4A4A4A;--border:#404040;--accent:#4EC9B0;--accent-light:#6EE7D0;--safe:#4EC9B0;--suspicious:#CE9178;--rogue:#F44747;--text:#E0E0E0;--text2:#A0A0A0;--muted:#6B6B6B;--radius:10px;--shadow:0 2px 8px rgba(0,0,0,0.3);--sidebar-w:240px}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.app-shell{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100}
.sidebar-brand{padding:20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border)}
.logo-icon{width:40px;height:40px;background:linear-gradient(135deg,#4EC9B0,#2E8B7A);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.logo-text{font-weight:700;font-size:18px}
.logo-text span{color:var(--accent)}
.sidebar-nav{flex:1;padding:16px 12px}
.nav-section{margin-bottom:20px}
.nav-section-title{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;padding:0 12px;margin-bottom:8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:var(--text2);font-size:13.5px;font-weight:500;transition:all .15s;text-decoration:none;margin-bottom:2px}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:rgba(78,201,176,0.1);color:var(--accent);border:1px solid rgba(78,201,176,0.2)}
.sidebar-footer{padding:12px;border-top:1px solid var(--border)}
.user-card{display:flex;align-items:center;gap:10px;padding:10px;background:var(--surface2);border-radius:8px;border:1px solid var(--border)}
.user-avatar{width:32px;height:32px;background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--bg);font-weight:600;font-size:13px;flex-shrink:0}
.user-info{flex:1;min-width:0}
.user-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-role{font-size:11px;color:var(--muted)}
.logout-btn{width:28px;height:28px;background:var(--surface3);border:1px solid var(--border);border-radius:6px;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .15s}
.logout-btn:hover{background:rgba(244,71,71,0.2);border-color:var(--rogue);color:var(--rogue)}

.main{margin-left:var(--sidebar-w);flex:1;padding:32px;max-width:1200px}
.page-header{margin-bottom:28px}
.page-title{font-size:28px;font-weight:700}
.page-subtitle{font-size:14px;color:var(--muted);margin-top:4px}

.card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);margin-bottom:24px}
.card-header{padding:18px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:15px;font-weight:600}
.card-body{padding:24px}

.history-list{display:flex;flex-direction:column;gap:12px}
.history-item{display:flex;align-items:center;gap:16px;padding:18px 20px;background:var(--surface2);border-radius:var(--radius);cursor:pointer;transition:all .2s;border:1px solid var(--border)}
.history-item:hover{background:var(--surface3);transform:translateX(4px);border-color:var(--accent)}
.history-icon{font-size:28px}
.history-info{flex:1}
.history-time{font-size:12px;color:var(--muted);margin-bottom:2px}
.history-files{font-size:14px;font-weight:500;margin-bottom:6px}
.history-badges{display:flex;gap:6px;flex-wrap:wrap}
.history-actions{display:flex;gap:8px}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.badge-rogue{background:rgba(244,71,71,0.15);color:var(--rogue)}
.badge-suspicious{background:rgba(206,145,120,0.15);color:var(--suspicious)}
.badge-neutral{background:var(--surface);color:var(--text2)}

.pagination{display:flex;justify-content:center;gap:8px;margin-top:24px}
.pagination button{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:6px;cursor:pointer}
.pagination button:hover:not(:disabled){background:var(--surface3)}
.pagination button:disabled{opacity:0.4;cursor:not-allowed}
.pagination span{padding:8px 12px;color:var(--muted)}

.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;font-weight:500;font-size:13px;cursor:pointer;border:none;transition:all .2s;text-decoration:none}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--surface3)}
.btn-sm{padding:6px 10px;font-size:12px}

.empty{text-align:center;padding:60px;color:var(--muted)}
.empty-icon{font-size:56px;margin-bottom:16px}

.loading{position:fixed;inset:0;background:rgba(30,30,30,0.95);display:flex;align-items:center;justify-content:center;z-index:1000;flex-direction:column;gap:16px}
.loading-spinner{width:44px;height:44px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:14px;color:var(--text2)}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="logo-icon">🛡</div>
      <div class="logo-text">Rogue<span>Shield</span></div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">
        <div class="nav-section-title">Overview</div>
        <a href="index.html" class="nav-item">Dashboard</a>
        <a href="demo.html" class="nav-item">Demo</a>
      </div>
      <div class="nav-section">
        <div class="nav-section-title">Analysis</div>
        <a href="scan.html" class="nav-item">Scan</a>
        <a href="history.html" class="nav-item active">History</a>
        <a href="results.html" class="nav-item">Results</a>
      </div>
      <div class="nav-section">
        <div class="nav-section-title">Management</div>
        <a href="whitelist.html" class="nav-item">Access Points</a>
        <a href="reports.html" class="nav-item">Reports</a>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="user-card">
        <div class="user-avatar" id="userAvatar">A</div>
        <div class="user-info">
          <div class="user-name" id="userName">Admin</div>
          <div class="user-role">Administrator</div>
        </div>
        <button class="logout-btn" onclick="logout()">↩</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="page-header">
      <div class="page-title">Scan History</div>
      <div class="page-subtitle">View and manage previous scan results</div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title">All Scans</div>
        <a href="scan.html" class="btn btn-secondary btn-sm">+ New Scan</a>
      </div>
      <div class="card-body">
        <div class="history-list" id="historyList">
          <div class="empty"><div class="empty-icon">📭</div><div class="empty-text">No scan history found</div></div>
        </div>
        <div class="pagination" id="pagination"></div>
      </div>
    </div>
  </main>
</div>

<div class="loading hidden" id="loading"><div class="loading-spinner"></div><div class="loading-text" id="loadingText">Loading...</div></div>

<script>
let scans=[],currentPage=1,perPage=10;
const api=(path,opts={})=>{const method=opts.method||'GET';const body=opts.body?JSON.stringify(opts.body):undefined;return fetch(path,{method,headers:{'Content-Type':'application/json',...opts.headers},credentials:'include',body}).then(async r=>{const t=await r.text();try{return JSON.parse(t)}catch{return{error:t}}})};
(async()=>{const me=await api('/api/me');if(me.error){window.location.href='/login.html';return;}document.getElementById('userAvatar').textContent=me.username[0].toUpperCase();document.getElementById('userName').textContent=me.username;loadHistory();})();
function logout(){api('/api/logout',{method:'POST'});window.location.href='/login.html';}

async function loadHistory(page=1){currentPage=page;showLoading(true);try{const d=await api(`/api/history?page=${page}&per_page=${perPage}`);scans=d.data||[];renderTable();}catch(e){console.error(e);}finally{showLoading(false);}}

function renderTable(){
  const el=document.getElementById('historyList');
  if(!scans.length){el.innerHTML='<div class="empty"><div class="empty-icon">📭</div><div class="empty-text">No scan history found</div></div>';document.getElementById('pagination').innerHTML='';return;}
  el.innerHTML=scans.map(s=>`<div class="history-item" onclick="viewScan('${s.scan_id}')">
    <div class="history-icon">${s.rogue_count>0?'🚨':s.susp_count>0?'⚠️':'✅'}</div>
    <div class="history-info">
      <div class="history-time">${new Date(s.timestamp).toLocaleString()}</div>
      <div class="history-files">${s.source_files}</div>
      <div class="history-badges">
        ${s.rogue_count>0?`<span class="badge badge-rogue">${s.rogue_count} Rogue</span>`:''}
        ${s.susp_count>0?`<span class="badge badge-suspicious">${s.susp_count} Suspicious</span>`:''}
        <span class="badge badge-neutral">${s.total_frames} frames</span>
      </div>
    </div>
    <div class="history-actions" onclick="event.stopPropagation()">
      <button class="btn btn-secondary btn-sm" onclick="downloadPDF('${s.scan_id}')">📄 PDF</button>
      <button class="btn btn-secondary btn-sm" onclick="deleteScan('${s.scan_id}')">🗑</button>
    </div>
  </div>`).join('');
  renderPagination();
}

function renderPagination(){
  const total=Math.ceil((scans[0]?.total||0)/perPage)||1;
  const el=document.getElementById('pagination');
  let html='';
  html+=`<button ${currentPage<=1?'disabled':''} onclick="loadHistory(${currentPage-1})">←</button>`;
  for(let i=1;i<=Math.min(total,5);i++)html+=`<button ${i===currentPage?'disabled':''} onclick="loadHistory(${i})">${i}</button>`;
  html+=`<button ${currentPage>=total?'disabled':''} onclick="loadHistory(${currentPage+1})">→</button>`;
  el.innerHTML=html;
}

function viewScan(scanId){window.location.href=`results.html?id=${scanId}`;}
function downloadPDF(scanId){window.location.href=`/api/report/${scanId}`;}
async function deleteScan(scanId){if(!confirm('Delete this scan?'))return;const d=await api(`/api/history/${scanId}`,{method:'DELETE'});if(d.ok)loadHistory(currentPage);}
function showLoading(show){document.getElementById('loading').classList.toggle('hidden',!show);}
</script>
</body>
</html>
