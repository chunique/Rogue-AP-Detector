<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>RogueShield — Forgot Password</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#1E1E1E;--surface:#2D2D2D;--surface2:#3D3D3D;--surface3:#4A4A4A;
  --border:#404040;--accent:#4EC9B0;--accent-light:#6EE7D0;
  --safe:#4EC9B0;--suspicious:#CE9178;--rogue:#F44747;
  --text:#E0E0E0;--text2:#A0A0A0;--muted:#6B6B6B;
  --radius:10px;--shadow:0 2px 8px rgba(0,0,0,0.3);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',Arial,sans-serif;background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:var(--text)}
.container{max-width:420px;width:100%;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.header{background:linear-gradient(135deg,#4EC9B0,#2E8B7A);padding:32px;text-align:center}
.header h1{color:#ffffff;font-size:22px;margin-bottom:6px;font-weight:700}
.header p{color:rgba(255,255,255,0.85);font-size:13px}
.content{padding:32px}
.form-group{margin-bottom:20px}
.form-group label{display:block;font-size:13px;font-weight:500;color:var(--text2);margin-bottom:8px}
.form-group input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:var(--surface2);color:var(--text);transition:border-color 0.2s}
.form-group input:focus{outline:none;border-color:var(--accent)}
.form-group input::placeholder{color:var(--muted)}
.btn{width:100%;padding:12px;background:linear-gradient(135deg,var(--accent),#2E8B7A);color:var(--bg);border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:all 0.2s;box-shadow:0 2px 8px rgba(78,201,176,.25)}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(78,201,176,.35)}
.btn:disabled{opacity:0.6;cursor:not-allowed;transform:none}
.error{background:rgba(244,71,71,.1);border:1px solid rgba(244,71,71,.3);color:var(--rogue);padding:12px;border-radius:8px;font-size:13px;margin-bottom:20px;display:none}
.success{background:rgba(78,201,176,.1);border:1px solid rgba(78,201,176,.3);color:var(--accent);padding:12px;border-radius:8px;font-size:13px;margin-bottom:20px;display:none}
.info{background:var(--surface2);border:1px solid var(--border);color:var(--text2);padding:12px;border-radius:8px;font-size:13px;margin-bottom:20px;display:block}
.link{text-align:center;margin-top:24px;font-size:13px;color:var(--muted)}
.link a{color:var(--accent);text-decoration:none;font-weight:500}
.link a:hover{text-decoration:underline}
.icon{font-size:44px;margin-bottom:12px}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="icon">🔒</div>
    <h1>Forgot Password?</h1>
    <p>Enter your email to reset your password</p>
  </div>
  <div class="content">
    <div class="info">
      Enter the email address associated with your account and we'll send you a link to reset your password.
    </div>
    <div class="error" id="errorMsg"></div>
    <div class="success" id="successMsg"></div>
    
    <div id="forgotForm">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="Enter your email address"/>
      </div>
      <button class="btn" id="submitBtn" onclick="sendResetLink()">Send Reset Link</button>
    </div>
    
    <div class="link">
      Remember your password? <a href="login.html">Sign in</a>
    </div>
  </div>
</div>

<script>
async function sendResetLink() {
  const email = document.getElementById('email').value.trim();
  const errorEl = document.getElementById('errorMsg');
  const successEl = document.getElementById('successMsg');
  const btn = document.getElementById('submitBtn');
  
  errorEl.style.display = 'none';
  successEl.style.display = 'none';
  
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    errorEl.textContent = 'Please enter a valid email address';
    errorEl.style.display = 'block';
    return;
  }
  
  btn.disabled = true;
  btn.textContent = 'Sending...';
  
  try {
    const res = await fetch('/api/forgot-password', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email})
    });
    const data = await res.json();
    
    successEl.textContent = 'If an account exists with this email, a password reset link has been sent. Please check your inbox.';
    successEl.style.display = 'block';
    document.getElementById('forgotForm').style.display = 'none';
  } catch (e) {
    errorEl.textContent = 'Network error. Please try again.';
    errorEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Send Reset Link';
  }
}

document.getElementById('email').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') sendResetLink();
});
</script>
</body>
</html>
