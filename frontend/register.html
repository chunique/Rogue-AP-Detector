<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>RogueShield — Create Account</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#1E1E1E;--surface:#2D2D2D;--surface2:#3D3D3D;--surface3:#4A4A4A;
  --border:#404040;--accent:#4EC9B0;--accent-light:#6EE7D0;
  --safe:#4EC9B0;--suspicious:#CE9178;--rogue:#F44747;
  --text:#E0E0E0;--text2:#A0A0A0;--muted:#6B6B6B;
  --radius:10px;--shadow:0 2px 8px rgba(0,0,0,0.3);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{background:var(--bg);font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:var(--text)}
.auth-wrap{position:relative;z-index:1;width:100%;max-width:440px}
.auth-brand{text-align:center;margin-bottom:28px}
.brand-mark{display:inline-flex;align-items:center;gap:12px;margin-bottom:8px}
.brand-icon{width:48px;height:48px;background:linear-gradient(135deg,#4EC9B0,#2E8B7A);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 4px 14px rgba(78,201,176,.3)}
.brand-name{font-size:24px;font-weight:700;color:var(--text)}
.brand-tagline{font-size:13px;color:var(--muted);margin-top:4px}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px;box-shadow:var(--shadow)}
.auth-heading{font-size:18px;font-weight:700;color:var(--text);margin-bottom:6px}
.auth-sub{font-size:13px;color:var(--muted);margin-bottom:24px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:13px;font-weight:500;color:var(--text2);margin-bottom:5px}
.input-wrap{position:relative}
.form-input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s;font-family:inherit;background:var(--surface2)}
.form-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(78,201,176,.15)}
.form-input.has-icon{padding-left:40px}
.form-input.error{border-color:var(--rogue)}
.form-input::placeholder{color:var(--muted)}
.input-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--muted);pointer-events:none}
.toggle-pw{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted);font-size:12px;padding:4px 6px;border-radius:4px}
.toggle-pw:hover{color:var(--accent)}
.field-error{font-size:11.5px;color:var(--rogue);margin-top:4px;display:none}
.field-error.show{display:block}

/* Password strength */
.pw-strength{margin-top:8px}
.pw-bars{display:flex;gap:4px;height:4px;margin-bottom:4px}
.pw-bar{flex:1;border-radius:2px;background:var(--surface3);transition:background .25s}
.pw-bar.weak{background:var(--rogue)}.pw-bar.fair{background:#fb923c}.pw-bar.good{background:#facc15}.pw-bar.strong{background:var(--accent)}
.pw-label{font-size:11px;color:var(--muted)}

/* Requirements checklist */
.req-list{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.req-item{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;transition:color .2s}
.req-item.met{color:var(--accent)}
.req-item .req-dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:9px;transition:all .2s;flex-shrink:0}
.req-item.met .req-dot{background:var(--accent);border-color:var(--accent);color:var(--bg)}

.error-box{display:none;align-items:center;gap:10px;padding:12px 14px;background:rgba(244,71,71,.1);border:1px solid rgba(244,71,71,.3);border-radius:8px;font-size:13px;color:var(--rogue);margin-bottom:16px}
.error-box.show{display:flex}
.success-box{display:none;align-items:center;gap:8px;padding:14px 16px;background:rgba(78,201,176,.1);border:1px solid rgba(78,201,176,.3);border-radius:8px;font-size:13px;color:var(--accent);margin-bottom:16px}
.success-box.show{display:flex}

.btn-submit{width:100%;padding:12px;background:linear-gradient(135deg,var(--accent),#2E8B7A);color:var(--bg);border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit;box-shadow:0 2px 8px rgba(78,201,176,.25)}
.btn-submit:hover{box-shadow:0 4px 14px rgba(78,201,176,.35);transform:translateY(-1px)}
.btn-submit:disabled{opacity:.6;cursor:not-allowed;transform:none;box-shadow:none}
.auth-footer{text-align:center;margin-top:20px;font-size:13px;color:var(--muted)}
.auth-footer a{color:var(--accent);font-weight:500;text-decoration:none}
.auth-footer a:hover{text-decoration:underline}
.divider{display:flex;align-items:center;gap:12px;margin:16px 0;font-size:12px;color:var(--muted)}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-brand">
    <div class="brand-mark">
      <div class="brand-icon">🛡</div>
      <div class="brand-name">RogueShield</div>
    </div>
    <div class="brand-tagline">Create your account</div>
  </div>

  <div class="auth-card">
    <div class="auth-heading">Create account</div>
    <div class="auth-sub">Set up your RogueShield profile</div>

    <div class="error-box"   id="errorBox"><span>⚠</span><span id="errorMsg"></span></div>
    <div class="success-box" id="successBox"><span>✓</span><span id="successMsg">Account created! Redirecting to login…</span></div>

    <div class="form-group">
      <label class="form-label">Username <span style="color:var(--rogue)">*</span></label>
      <div class="input-wrap">
        <span class="input-icon">👤</span>
        <input class="form-input has-icon" id="username" type="text" placeholder="e.g. john_doe" autocomplete="username" oninput="validateUsername()"/>
      </div>
      <div class="field-error" id="usernameErr"></div>
    </div>

    <div class="form-group">
      <label class="form-label">Email address <span style="color:var(--rogue)">*</span></label>
      <div class="input-wrap">
        <span class="input-icon">✉</span>
        <input class="form-input has-icon" id="email" type="email" placeholder="you@gmail.com" autocomplete="email" oninput="validateEmail()"/>
      </div>
      <div class="field-error" id="emailErr"></div>
    </div>

    <div class="form-group">
      <label class="form-label">Password <span style="color:var(--rogue)">*</span></label>
      <div class="input-wrap">
        <span class="input-icon">🔒</span>
        <input class="form-input has-icon" id="password" type="password" placeholder="Create a strong password" autocomplete="new-password" oninput="checkStrength()"/>
        <button class="toggle-pw" type="button" onclick="togglePw('password','t1')" id="t1">Show</button>
      </div>
      <div class="pw-strength">
        <div class="pw-bars">
          <div class="pw-bar" id="b1"></div><div class="pw-bar" id="b2"></div>
          <div class="pw-bar" id="b3"></div><div class="pw-bar" id="b4"></div>
        </div>
        <div class="pw-label" id="pwLabel">Enter a password</div>
      </div>
      <div class="req-list">
        <div class="req-item" id="r1"><span class="req-dot"></span>At least 8 characters</div>
        <div class="req-item" id="r2"><span class="req-dot"></span>One uppercase letter</div>
        <div class="req-item" id="r3"><span class="req-dot"></span>One number</div>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Confirm password <span style="color:var(--rogue)">*</span></label>
      <div class="input-wrap">
        <span class="input-icon">🔒</span>
        <input class="form-input has-icon" id="confirm" type="password" placeholder="Repeat your password" autocomplete="new-password" oninput="validateConfirm()"/>
        <button class="toggle-pw" type="button" onclick="togglePw('confirm','t2')" id="t2">Show</button>
      </div>
      <div class="field-error" id="confirmErr"></div>
    </div>

    <button class="btn-submit" id="regBtn" onclick="doRegister()">Create Account</button>

    <div class="divider">already have an account</div>
  </div>

  <div class="auth-footer">
    Already have an account? <a href="login.html">Sign in →</a>
  </div>
</div>

<script>
let visible1=false, visible2=false;
function togglePw(id, btnId) {
  if(id==='password'){visible1=!visible1;document.getElementById(id).type=visible1?'text':'password';document.getElementById(btnId).textContent=visible1?'Hide':'Show';}
  else{visible2=!visible2;document.getElementById(id).type=visible2?'text':'password';document.getElementById(btnId).textContent=visible2?'Hide':'Show';}
}

function setReq(id, met) {
  const el = document.getElementById(id);
  el.classList.toggle('met', met);
  el.querySelector('.req-dot').textContent = met ? '✓' : '';
}

function checkStrength() {
  const pw = document.getElementById('password').value;
  const len = pw.length >= 8;
  const up  = /[A-Z]/.test(pw);
  const num = /[0-9]/.test(pw);
  setReq('r1',len); setReq('r2',up); setReq('r3',num);
  const score = [len,up,num,pw.length>=12].filter(Boolean).length;
  const cls   = ['','weak','fair','good','strong'][score];
  const label = ['Enter a password','Weak','Fair','Good','Strong'][score];
  const colors = {weak:'#f87171',fair:'#fb923c',good:'#facc15',strong:'#4EC9B0'};
  ['b1','b2','b3','b4'].forEach((id,i) => {
    const b = document.getElementById(id);
    b.className = 'pw-bar';
    if(i < score) b.classList.add(cls);
  });
  document.getElementById('pwLabel').textContent = label;
  document.getElementById('pwLabel').style.color = colors[cls]||'#6B6B6B';
  validateConfirm();
}

function validateUsername() {
  const v = document.getElementById('username').value;
  const e = document.getElementById('usernameErr');
  if(v && v.length < 3){showFieldErr('usernameErr','Username must be at least 3 characters');}
  else if(v && !/^[a-zA-Z0-9_]+$/.test(v)){showFieldErr('usernameErr','Only letters, numbers, and underscores allowed');}
  else{e.classList.remove('show');}
}
function validateEmail() {
  const v = document.getElementById('email').value;
  const e = document.getElementById('emailErr');
  if(v && !/^[^@]+@gmail\.com$/.test(v)){showFieldErr('emailErr','Only Gmail addresses (@gmail.com) are allowed');}
  else{e.classList.remove('show');}
}
function validateConfirm() {
  const p = document.getElementById('password').value;
  const c = document.getElementById('confirm').value;
  if(c && p !== c){showFieldErr('confirmErr','Passwords do not match');}
  else{document.getElementById('confirmErr').classList.remove('show');}
}
function showFieldErr(id, msg) {
  const e = document.getElementById(id);
  e.textContent = msg; e.classList.add('show');
}

async function doRegister() {
  const username = document.getElementById('username').value.trim();
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const confirm  = document.getElementById('confirm').value;
  const btn = document.getElementById('regBtn');
  document.getElementById('errorBox').classList.remove('show');

  if (!username||!email||!password||!confirm){showErr('Please fill in all fields.');return;}

  btn.disabled=true; btn.textContent='Creating account…';
  try {
    const res = await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username,email,password,confirm})});
    const data = await res.json();
    if(data.ok || res.ok){
      document.getElementById('successBox').classList.add('show');
      document.getElementById('successMsg').textContent = data.message || 'Registration successful! Redirecting...';
      document.querySelector('.auth-card').querySelectorAll('input').forEach(i => i.disabled = true);
      btn.style.display = 'none';
      setTimeout(()=>window.location.href='login.html',2500);
    } else {
      showErr(data.error || 'Registration failed. Please try again.');
    }
  } catch {
    showErr('Connection error. Please check your network and try again.');
  }
  finally { if (!document.getElementById('successBox').classList.contains('show')) { btn.disabled=false; btn.textContent='Create Account'; } }
}

function showErr(msg){
  document.getElementById('errorMsg').textContent=msg;
  document.getElementById('errorBox').classList.add('show');
}
</script>
</body>
</html>
